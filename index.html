<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>피카츄 살리기 - 업그레이드 에디션</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0d0f12;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            touch-action: none;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .game-wrapper {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 12px;
            background: rgba(22, 27, 34, 0.85);
            padding: 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            max-width: 900px;
            width: 100%;
            max-height: 100vh;
        }

        /* 타임라인 사이드바 */
        .timeline-sidebar {
            width: 50px;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .timeline-header {
            text-align: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timeline-title {
            font-size: 16px;
            color: #ffd000;
        }

        .timeline-body {
            position: relative;
            flex: 1;
            display: flex;
            margin: 4px 0;
        }

        .progress-track {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 10px;
            bottom: 10px;
            width: 6px;
            background: #21262d;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #ff9900, #ffee00, #00f2fe);
            transition: height 0.2s ease-out;
        }

        .phase-nodes {
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            right: 0;
        }

        .phase-node {
            position: absolute;
            left: 0;
            right: 0;
            transform: translateY(50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .node-pin {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #161b22;
            border: 2px solid #484f58;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .phase-node.reached .node-pin {
            border-color: #ffd000;
            background: #2d2605;
        }

        .phase-node.active .node-pin {
            border-color: #00f2fe;
            background: #0d2938;
            transform: scale(1.15);
        }

        /* 메인 게임 영역 */
        .game-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-width: 0;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
        }

        .score-info {
            font-size: 16px;
            font-weight: 800;
            color: #ffd000;
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .invincible-text {
            color: #ffee00;
            font-size: 12px;
            font-weight: bold;
        }

        .lives-container {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .life-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .life-icon.lost {
            opacity: 0.15;
            filter: grayscale(100%);
        }

        .game-main-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            background-color: #000;
            border: 2px solid #30363d;
            border-radius: 12px;
            display: block;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .action-btn {
            background: linear-gradient(135deg, #21262d, #30363d);
            color: #8b949e;
            border: 1px solid #484f58;
            border-radius: 8px;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .action-btn.active {
            background: linear-gradient(135deg, #ff9900, #ffee00);
            color: #000;
            border-color: #ffffff;
        }

        .action-btn.sound-active {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            border-color: #ffffff;
        }

        .joystick-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .joystick-base {
            position: relative;
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joystick-stick {
            position: absolute;
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, #ffee00 0%, #ff9900 100%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .game-wrapper {
                padding: 10px;
                gap: 8px;
            }
            .timeline-sidebar {
                width: 40px;
            }
            .node-pin {
                width: 22px;
                height: 22px;
                font-size: 10px;
            }
            .joystick-base {
                width: 80px;
                height: 80px;
            }
            .joystick-stick {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="timeline-sidebar">
            <div class="timeline-header">
                <div class="timeline-title">⚡</div>
            </div>
            <div class="timeline-body">
                <div class="progress-track">
                    <div id="progressBarFill" class="progress-fill"></div>
                </div>
                <div class="phase-nodes">
                    <div class="phase-node" id="node-70" style="bottom: 100%;">
                        <div class="node-pin">⚡</div>
                    </div>
                    <div class="phase-node" id="node-50" style="bottom: 71.4%;">
                        <div class="node-pin">🔮</div>
                    </div>
                    <div class="phase-node" id="node-35" style="bottom: 50%;">
                        <div class="node-pin">💧</div>
                    </div>
                    <div class="phase-node" id="node-18" style="bottom: 25.7%;">
                        <div class="node-pin">🔥</div>
                    </div>
                    <div class="phase-node active reached" id="node-0" style="bottom: 0%;">
                        <div class="node-pin">🌱</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="game-main">
            <div class="header-container">
                <div class="score-info">
                    SCORE: <span id="scoreText">0</span>
                </div>
                <div class="controls-right">
                    <span id="invincibleStatus" class="invincible-text" style="display: none;">⚡ 무적! ⚡</span>
                    <div id="livesContainer" class="lives-container"></div>
                </div>
            </div>

            <div class="game-main-content">
                <div class="canvas-container">
                    <canvas id="gameCanvas" width="600" height="600"></canvas>
                </div>
                
                <div class="controls-panel">
                    <div class="btn-group">
                        <button id="godModeBtn" class="action-btn">🛡️ 무적 OFF</button>
                        <button id="soundBtn" class="action-btn">🎵 사운드 OFF</button>
                    </div>
                    
                    <div class="joystick-container">
                        <div id="joystickBase" class="joystick-base">
                            <div id="joystickStick" class="joystick-stick"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreTextElement = document.getElementById("scoreText");
        const invincibleStatusElement = document.getElementById("invincibleStatus");
        const livesContainer = document.getElementById("livesContainer");
        const godModeBtn = document.getElementById("godModeBtn");
        const soundBtn = document.getElementById("soundBtn");

        const progressBarFill = document.getElementById("progressBarFill");
        const node0 = document.getElementById("node-0");
        const node18 = document.getElementById("node-18");
        const node35 = document.getElementById("node-35");
        const node50 = document.getElementById("node-50");
        const node70 = document.getElementById("node-70");

        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 600;

        /* 오디오 시스템 */
        let audioCtx = null;
        let isSoundOn = false;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!isSoundOn || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playHitSound() { playTone(150, 'sawtooth', 0.2, 0.2); }
        function playPowerupSound() {
            if (!isSoundOn || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(now + 0.3);
        }
        function playSkillSound() {
            playTone(587, 'square', 0.15, 0.1);
            setTimeout(() => playTone(880, 'square', 0.25, 0.1), 100);
        }

        function startBGM() {
            if (!isSoundOn || !audioCtx || bgmInterval) return;
            const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!isSoundOn || document.hidden || isGameOver) return;
                playTone(notes[step % notes.length], 'sine', 0.15, 0.03);
                step++;
            }, 250);
        }

        function stopBGM() {
            if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
        }

        soundBtn.addEventListener("click", () => {
            initAudio();
            isSoundOn = !isSoundOn;
            if (isSoundOn) {
                soundBtn.classList.add("sound-active");
                soundBtn.textContent = "🎵 사운드 ON";
                startBGM();
            } else {
                soundBtn.classList.remove("sound-active");
                soundBtn.textContent = "🎵 사운드 OFF";
                stopBGM();
            }
        });

        /* 이미지 리소스 */
        const BASE_CDN = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/";
        
        let pikachuLoaded = false, raichuLoaded = false, charizardLoaded = false, redLoaded = false;
        let blastoiseLoaded = false, mewtwoLoaded = false, alakazamLoaded = false, oakLoaded = false;
        let slowpokeLoaded = false, slowkingLoaded = false, slowbroLoaded = false;
        let magikarpLoaded = false, mewLoaded = false;
        let pidgeotLoaded = false, gyaradosLoaded = false, redGyaradosLoaded = false, jynxLoaded = false, snorlaxLoaded = false;
        let zapdosLoaded = false, hoohLoaded = false, articunoLoaded = false, moltresLoaded = false;
        let gastlyLoaded = false, haunterLoaded = false, gengarLoaded = false;
        let thunderStoneLoaded = false, swimmerf2Loaded = false, swimmerLoaded = false;
        let dratiniLoaded = false, dragonairLoaded = false, dragoniteLoaded = false, laprasLoaded = false;

        const newObstacleImgs = {};
        const newObstacleList = [
            { id: 39, name: 'jigglypuff', emoji: '🎤' }, { id: 50, name: 'diglett', emoji: '🕳️' },
            { id: 52, name: 'meowth', emoji: '🐱' }, { id: 56, name: 'mankey', emoji: '🐒' },
            { id: 73, name: 'tentacruel', emoji: '🦑' }, { id: 78, name: 'rapidash', emoji: '🦄' },
            { id: 104, name: 'cubone', emoji: '🦴' }, { id: 108, name: 'lickitung', emoji: '👅' },
            { id: 111, name: 'rhyhorn', emoji: '🦏' }, { id: 132, name: 'ditto', emoji: '🫠' }
        ];

        function loadImage(url, onLoad) {
            const img = new Image();
            img.onload = onLoad;
            img.src = url;
            return img;
        }

        const pikachuImg = loadImage(`${BASE_CDN}25.png`, () => pikachuLoaded = true);
        const raichuImg = loadImage(`${BASE_CDN}26.png`, () => raichuLoaded = true);
        const charizardImg = loadImage("https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png", () => charizardLoaded = true);
        const blastoiseImg = loadImage("https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/9.png", () => blastoiseLoaded = true);
        const alakazamImg = loadImage("https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/65.png", () => alakazamLoaded = true);
        const mewtwoImg = loadImage(`${BASE_CDN}150.png`, () => mewtwoLoaded = true);
        const articunoImg = loadImage(`${BASE_CDN}144.png`, () => articunoLoaded = true);
        const zapdosImg = loadImage(`${BASE_CDN}145.png`, () => zapdosLoaded = true);
        const moltresImg = loadImage(`${BASE_CDN}146.png`, () => moltresLoaded = true);
        const oakImg = loadImage("https://play.pokemonshowdown.com/sprites/trainers/oak.png", () => oakLoaded = true);
        const swimmerf2Img = loadImage("https://play.pokemonshowdown.com/sprites/gen6/swimmerf2.png", () => swimmerf2Loaded = true);
        const swimmerImg = loadImage("https://play.pokemonshowdown.com/sprites/gen4/swimmer.png", () => swimmerLoaded = true);
        const dratiniImg = loadImage(`${BASE_CDN}147.png`, () => dratiniLoaded = true);
        const dragonairImg = loadImage(`${BASE_CDN}148.png`, () => dragonairLoaded = true);
        const dragoniteImg = loadImage(`${BASE_CDN}149.png`, () => dragoniteLoaded = true);
        const laprasImg = loadImage(`${BASE_CDN}131.png`, () => laprasLoaded = true);
        const slowpokeImg = loadImage(`${BASE_CDN}79.png`, () => slowpokeLoaded = true);
        const slowkingImg = loadImage(`${BASE_CDN}199.png`, () => slowkingLoaded = true);
        const slowbroImg = loadImage(`${BASE_CDN}80.png`, () => slowbroLoaded = true);
        const magikarpImg = loadImage(`${BASE_CDN}129.png`, () => magikarpLoaded = true);
        const mewImg = loadImage(`${BASE_CDN}151.png`, () => mewLoaded = true);
        const pidgeotImg = loadImage(`${BASE_CDN}18.png`, () => pidgeotLoaded = true);
        const gyaradosImg = loadImage(`${BASE_CDN}130.png`, () => gyaradosLoaded = true);
        const redGyaradosImg = loadImage("https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/130.png", () => redGyaradosLoaded = true);
        const jynxImg = loadImage(`${BASE_CDN}124.png`, () => jynxLoaded = true);
        const snorlaxImg = loadImage(`${BASE_CDN}143.png`, () => snorlaxLoaded = true);
        const hoohImg = loadImage(`${BASE_CDN}250.png`, () => hoohLoaded = true);
        const gastlyImg = loadImage(`${BASE_CDN}92.png`, () => gastlyLoaded = true);
        const haunterImg = loadImage(`${BASE_CDN}93.png`, () => haunterLoaded = true);
        const gengarImg = loadImage(`${BASE_CDN}94.png`, () => gengarLoaded = true);
        const redImg = loadImage("https://play.pokemonshowdown.com/sprites/trainers/red.png", () => redLoaded = true);

        newObstacleList.forEach(item => {
            newObstacleImgs[item.name] = { img: null, loaded: false, emoji: item.emoji };
            newObstacleImgs[item.name].img = loadImage(`${BASE_CDN}${item.id}.png`, () => {
                newObstacleImgs[item.name].loaded = true;
            });
        });

        const thunderStoneImg = new Image();
        thunderStoneImg.onload = () => thunderStoneLoaded = true;
        thunderStoneImg.src = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ffea00' opacity='0.25'/%3E%3Cpolygon points='50,6 88,26 92,68 50,94 8,68 12,26' fill='%23cc7a00' stroke='%23ffea00' stroke-width='4'/%3E%3Cpolygon points='50,12 82,30 85,64 50,88 15,64 18,30' fill='%23ff9900'/%3E%3Cpolygon points='50,12 50,88 85,64' fill='%23b36200' opacity='0.4'/%3E%3Cpolygon points='50,12 18,30 15,64' fill='%23ffbf00' opacity='0.5'/%3E%3Cpath d='M58,14 L28,50 L48,50 L38,86 L74,42 L52,42 Z' fill='%23ffffff' stroke='%23111111' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M56,17 L32,48 L48,48 L40,81 L70,44 L53,44 Z' fill='%23ffff00'/%3E%3C/svg%3E";

        /* 게임 변수 */
        const BASE_SLOWPOKE_SPEED = 150;
        const BASE_MAGIKARP_SPEED = BASE_SLOWPOKE_SPEED * 0.5;
        const THUNDER_STONE_SPEED = BASE_MAGIKARP_SPEED;
        const BASE_PIDGEOT_SPEED = 304;
        const BASE_ZAPDOS_SPEED = 456;

        let lives = 3;
        const MAX_LIVES = 3;

        let isGodMode = false;
        let isGameOver = false;
        let isPhase2 = false;
        let charizardTriggered = false;
        let blastoiseTriggered = false;
        let alakazamTriggered = false;
        let pikachuThunderboltTriggered = false;
        let redThunderTriggered = false;
        let isCharizardEventFinished = false;
        let isBlastoiseEventFinished = false;
        let isSpeedBoostedAt40 = false;
        let isInfiniteMode = false;

        let red = null, charizard = null, blastoise = null, alakazam = null;
        let fireBlast = null, hydroPump = null;
        let isPsychicActive = false;
        let globalObstacleOpacity = 1.0;
        let fireParticles = [];

        let restartBtnRect = { x: 0, y: 0, w: 0, h: 0 };
        let isThunderboltActive = false;
        let thunderboltTimer = 0;
        let lightningBolts = [];
        let speedUpFlashTimer = 0;
        let speedUpFlashParticles = [];

        /* 터치 및 조이스틱 컨트롤 */
        let joystickTouchId = null;
        let joystickVector = { x: 0, y: 0 };
        const joystickBase = document.getElementById("joystickBase");
        const joystickStick = document.getElementById("joystickStick");

        godModeBtn.addEventListener("click", () => {
            isGodMode = !isGodMode;
            if (isGodMode) {
                godModeBtn.classList.add("active");
                godModeBtn.textContent = "🛡️ 무적 ON";
            } else {
                godModeBtn.classList.remove("active");
                godModeBtn.textContent = "🛡️ 무적 OFF";
            }
        });

        function handleJoystickTouch(e) {
            e.preventDefault();
            const rect = joystickBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                if (joystickTouchId === null || touch.identifier === joystickTouchId) {
                    joystickTouchId = touch.identifier;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    const dist = Math.hypot(dx, dy);
                    const maxR = rect.width / 2 - 10;

                    if (dist > maxR) {
                        dx = (dx / dist) * maxR;
                        dy = (dy / dist) * maxR;
                    }

                    joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                    joystickVector = { x: dx / maxR, y: dy / maxR };
                    break;
                }
            }
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            if (joystickTouchId === null) return;
            let ended = true;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].identifier === joystickTouchId) {
                    ended = false;
                    break;
                }
            }
            if (ended) {
                joystickTouchId = null;
                joystickVector = { x: 0, y: 0 };
                joystickStick.style.transform = "translate(0px, 0px)";
            }
        }

        joystickBase.addEventListener("touchstart", handleJoystickTouch, { passive: false });
        joystickBase.addEventListener("touchmove", handleJoystickTouch, { passive: false });
        joystickBase.addEventListener("touchend", handleJoystickEnd, { passive: false });
        joystickBase.addEventListener("touchcancel", handleJoystickEnd, { passive: false });

        let startTime = Date.now();
        let totalPausedTime = 0;
        let pauseStartTime = 0;
        let survivalTime = 0;
        let score = 0;
        let lastTime = 0;

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                pauseStartTime = Date.now();
                stopBGM();
            } else {
                if (pauseStartTime > 0) {
                    totalPausedTime += (Date.now() - pauseStartTime);
                    pauseStartTime = 0;
                }
                lastTime = performance.now();
                if (isSoundOn) startBGM();
            }
        });

        let pidgeotInterval = null, zapdosInterval = null, magikarpInterval = null;
        let thunderStoneTimeout = null, thunderStoneInterval = null, ghostInterval = null;
        let infiniteObstacleInterval = null, legendaryBirdsInterval = null, laprasInterval = null;

        function handleCanvasInteraction(e) {
            if (!isGameOver) return;

            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const clickX = (clientX - rect.left) * (canvas.width / rect.width);
            const clickY = (clientY - rect.top) * (canvas.height / rect.height);

            if (
                clickX >= restartBtnRect.x &&
                clickX <= restartBtnRect.x + restartBtnRect.w &&
                clickY >= restartBtnRect.y &&
                clickY <= restartBtnRect.y + restartBtnRect.h
            ) {

        function updateProgressBar() {

            const nodes = [
                { el: node0, time: 0 }, { el: node18, time: 18 },
                { el: node35, time: 35 }, { el: node50, time: 50 }, { el: node70, time: 70 }
            ];

            let currentActiveIndex = 0;
            nodes.forEach((n, idx) => {
                if (!n.el) return;
                if (survivalTime >= n.time) {
                    n.el.classList.add("reached");
                    currentActiveIndex = idx;
                } else {
                    n.el.classList.remove("reached");
                }
                n.el.classList.remove("active");
            });

            if (nodes[currentActiveIndex]?.el) nodes[currentActiveIndex].el.classList.add("active");
        }

        function getSpawnPosition() {

            else if (side === 1) { spawnX = CANVAS_WIDTH + 50; spawnY = Math.random() * CANVAS_HEIGHT; }
            else if (side === 2) { spawnX = Math.random() * CANVAS_WIDTH; spawnY = CANVAS_HEIGHT + 50; }
            else { spawnX = -50; spawnY = Math.random() * CANVAS_HEIGHT; }
            return { spawnX, spawnY };
        }

        function startSpecialTimers() {

            magikarpInterval = setInterval(() => { if (!isGameOver && !isInfiniteMode && !document.hidden) spawnMagikarp(); }, 15000);

            clearTimeout(swimmerTimeout); clearTimeout(dratiniTimeout); clearTimeout(dragonairTimeout); clearTimeout(dragoniteTimeout);

            isInfiniteMode = true;

            slowpokes = []; magikarps = []; pidgeots = []; zapdoses = []; ghosts = [];

            infiniteObstacleInterval = setInterval(() => { if (!isGameOver && !document.hidden) spawnInfiniteRandomObstacle(); }, 500);
            laprasInterval = setInterval(() => { if (!isGameOver && isInfiniteMode && !document.hidden) spawnLapras(); }, 10000);
            thunderStoneInterval = setInterval(() => { if (!isGameOver && !document.hidden) spawnThunderStone(); }, 12000);

            setTimeout(() => {
                if (!isGameOver && isInfiniteMode) {

                }
            }, 35000);

            swimmerTimeout = setTimeout(() => { if (!isGameOver && !document.hidden) spawnSwimmerObstacles(); }, 10000);
            dratiniTimeout = setTimeout(() => { if (!isGameOver && !document.hidden) spawnDragonObstacle('dratini'); }, 20000);
            dragonairTimeout = setTimeout(() => { if (!isGameOver && !document.hidden) spawnDragonObstacle('dragonair'); }, 25000);
            dragoniteTimeout = setTimeout(() => { if (!isGameOver && !document.hidden) spawnDragonObstacle('dragonite'); }, 30000);

        function restartGame() {
            isGameOver = false; isPhase2 = false; charizardTriggered = false; blastoiseTriggered = false;
            alakazamTriggered = false; pikachuThunderboltTriggered = false; redThunderTriggered = false;
            isCharizardEventFinished = false; isBlastoiseEventFinished = false; isSpeedBoostedAt40 = false; isInfiniteMode = false;

            lives = 3; score = 0; updateLivesUI();
            red = null; charizard = null; blastoise = null; alakazam = null;
            fireBlast = null; hydroPump = null; isPsychicActive = false;
            globalObstacleOpacity = 1.0; fireParticles = [];

            isThunderboltActive = false; thunderboltTimer = 0; lightningBolts = [];
            slowpokes = []; magikarps = []; pidgeots = []; zapdoses = []; ghosts = [];
            infiniteObstacles = []; swimmers = []; dragons = []; thunderStones = [];
            electricSparkParticles = []; speedUpFlashParticles = []; speedUpFlashTimer = 0;

            joystickTouchId = null; joystickVector = { x: 0, y: 0 };
            joystickStick.style.transform = "translate(0px, 0px)";

            nextMewtwoSpawnTime = 30; isGhostPhase = false;
            clearAllTimers();

            pikachu.x = CANVAS_WIDTH / 2; pikachu.y = CANVAS_HEIGHT / 2;
            pikachu.normalSpeed = 210; pikachu.speed = 210;
            pikachu.isInvincible = false; pikachu.invincibleTimer = 0; pikachu.hitInvincibleTimer = 0;

            if (invincibleStatusElement) {
                invincibleStatusElement.style.display = "none";
                invincibleStatusElement.style.opacity = "1";
            }

            startTime = Date.now(); totalPausedTime = 0; pauseStartTime = 0;
            lastTime = performance.now();
            updateProgressBar();
            startSpecialTimers();
            requestAnimationFrame(gameLoop);
        }

        function update(currentTime) {
            if (isGameOver) return;

            if (!lastTime) lastTime = currentTime;
            let dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (document.hidden) return;
            if (isNaN(dt) || dt > 0.1) dt = 0.016;

            if (!isThunderboltActive) {
                const elapsedMs = Date.now() - startTime - totalPausedTime;
                survivalTime = Math.floor(elapsedMs / 1000);
                score = Math.floor(elapsedMs / 100);
                if (scoreTextElement) scoreTextElement.textContent = score;
                updateProgressBar();
            }

            if (survivalTime >= 40 && !isSpeedBoostedAt40) {
                isSpeedBoostedAt40 = true;
                pikachu.normalSpeed = pikachu.boostedSpeed;
                if (!pikachu.isInvincible) pikachu.speed = pikachu.boostedSpeed;
                speedUpFlashTimer = 1.0;
                for (let i = 0; i < 28; i++) {
                    const angle = (i / 28) * Math.PI * 2;
                    speedUpFlashParticles.push({
                        x: pikachu.x, y: pikachu.y,
                        vx: Math.cos(angle) * (Math.random() * 160 + 90),
                        vy: Math.sin(angle) * (Math.random() * 160 + 90),
                        size: Math.random() * 6 + 3, life: 1.0, decay: 1.4,
                        color: i % 2 === 0 ? '#ffff00' : '#00f2fe'
                    });
                }
            }

            if (survivalTime >= 70 && !pikachuThunderboltTriggered) {
                pikachuThunderboltTriggered = true;
                playSkillSound();
                red = { x: CANVAS_WIDTH + 100, y: CANVAS_HEIGHT / 2 + 100, targetX: CANVAS_WIDTH - 70, drawWidth: 150, drawHeight: 150, state: 'entering_p', timer: 0, text: "피카츄, 백만볼트!" };
            } else if (survivalTime >= nextMewtwoSpawnTime && survivalTime < 70) {
                spawnZapdos(true);
                nextMewtwoSpawnTime += 10;
            }

            if (survivalTime >= 50 && !alakazamTriggered) {
                alakazamTriggered = true; playSkillSound();
                red = { x: CANVAS_WIDTH + 100, y: CANVAS_HEIGHT / 2 + 100, targetX: CANVAS_WIDTH - 70, drawWidth: 150, drawHeight: 150, state: 'entering_a', timer: 0, text: "후딘, 사이코키네시스!" };
            } else if (survivalTime >= 35 && !blastoiseTriggered) {
                blastoiseTriggered = true; playSkillSound();
                red = { x: CANVAS_WIDTH + 100, y: CANVAS_HEIGHT / 2 + 100, targetX: CANVAS_WIDTH - 70, drawWidth: 150, drawHeight: 150, state: 'entering_b', timer: 0, text: "거북왕, 하이드로펌프!" };
            } else if (survivalTime >= 18 && !charizardTriggered) {
                charizardTriggered = true; isPhase2 = true; playSkillSound();
                red = { x: CANVAS_WIDTH + 100, y: CANVAS_HEIGHT / 2 + 100, targetX: CANVAS_WIDTH - 70, drawWidth: 150, drawHeight: 150, state: 'entering', timer: 0, text: "리자몽, 불대문자!" };
            }

            if (red) {
                if (red.state.startsWith('entering')) {
                    red.x -= 300 * dt;
                    if (red.x <= red.targetX) { red.x = red.targetX; red.state = red.state.replace('entering', 'shouting'); }
                } else if (red.state.startsWith('shouting')) {
                    red.timer += dt;
                    if (red.state === 'shouting_p') {
                        if (red.timer > 0.8 && !isThunderboltActive) {
                            isThunderboltActive = true; thunderboltTimer = 0; redThunderTriggered = true;
                            slowpokes = []; magikarps = []; pidgeots = []; zapdoses = []; ghosts = []; thunderStones = [];
                            clearInterval(ghostInterval);
                            red.state = 'leaves_p';
                        }
                    } else if (red.timer > 1.2) {
                        if (red.state === 'shouting' && !charizard) charizard = { x: CANVAS_WIDTH + 260, y: CANVAS_HEIGHT / 2 - 40, targetX: CANVAS_WIDTH - 150, drawWidth: 340, drawHeight: 340, state: 'entering' };
                        else if (red.state === 'shouting_b' && !blastoise) blastoise = { x: CANVAS_WIDTH + 260, y: CANVAS_HEIGHT / 2 - 40, targetX: CANVAS_WIDTH - 150, drawWidth: 340, drawHeight: 340, state: 'entering' };
                        else if (red.state === 'shouting_a' && !alakazam) alakazam = { x: CANVAS_WIDTH + 260, y: CANVAS_HEIGHT / 2 - 40, targetX: CANVAS_WIDTH - 150, drawWidth: 340, drawHeight: 340, state: 'entering' };
                    }
                } else if (red.state === 'leaving' || red.state === 'leaves_p') {
                    red.x += 350 * dt;
                    if (red.x > CANVAS_WIDTH + 140) red = null;
                }
            }

            if (isThunderboltActive) {
                thunderboltTimer += dt;
                lightningBolts = Array.from({ length: 7 }, () => ({
                    startX: pikachu.x + (Math.random() - 0.5) * 30,
                    startY: pikachu.y + (Math.random() - 0.5) * 30,
                    endX: Math.random() * CANVAS_WIDTH,
                    endY: Math.random() * CANVAS_HEIGHT
                }));

                for (let i = 0; i < 8; i++) {
                    fireParticles.push({
                        x: Math.random() * CANVAS_WIDTH, y: Math.random() * CANVAS_HEIGHT,
                        vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200,
                        size: Math.random() * 8 + 4, life: 0.5, decay: 2.2,
                        colorType: Math.random() > 0.3 ? '#ffff00' : '#ffffff'
                    });
                }

                if (thunderboltTimer >= 2.0) { isThunderboltActive = false; lightningBolts = []; }
            }

            if (redThunderTriggered && !isThunderboltActive && !isInfiniteMode) startInfiniteMode();

            if (charizard) {
                if (charizard.state === 'entering') {
                    charizard.x -= 380 * dt;
                    if (charizard.x <= charizard.targetX) {
                        charizard.x = charizard.targetX; charizard.state = 'firing'; isCharizardEventFinished = true;
                        slowpokes.forEach(s => { if (s.type === 'slowpoke') { s.type = 'slowbro'; s.size = 18; s.drawWidth = 48; s.drawHeight = 48; } });
                        fireBlast = { x: charizard.x - 150, y: CANVAS_HEIGHT / 2, vx: -580, drawWidth: 540, drawHeight: 540 };
                    }
                } else if (charizard.state === 'firing') {
                    if (!fireBlast) { charizard.state = 'leaving'; if (red) red.state = 'leaving'; }
                } else if (charizard.state === 'leaving') {
                    charizard.x += 400 * dt;
                    if (charizard.x > CANVAS_WIDTH + 360) charizard = null;
                }
            }

            if (fireBlast) {
                fireBlast.x += fireBlast.vx * dt;
                const isSwept = (obj) => Math.abs(obj.y - fireBlast.y) < 250 && obj.x > fireBlast.x - 250;
                slowpokes = slowpokes.filter(s => !isSwept(s));
                magikarps = magikarps.filter(m => !isSwept(m));
                pidgeots = pidgeots.filter(p => !isSwept(p));
                zapdoses = zapdoses.filter(z => !isSwept(z));
                if (fireBlast.x < -360) fireBlast = null;
            }

            if (blastoise) {
                if (blastoise.state === 'entering') {
                    blastoise.x -= 380 * dt;
                    if (blastoise.x <= blastoise.targetX) {
                        blastoise.x = blastoise.targetX; blastoise.state = 'firing'; isBlastoiseEventFinished = true;
                        slowpokes.forEach(s => { if (s.type === 'slowpoke' || s.type === 'slowbro') { s.type = 'slowking'; s.size = 23.4; s.drawWidth = 62.4; s.drawHeight = 62.4; } });
                        hydroPump = { x: blastoise.x - 150, y: CANVAS_HEIGHT / 2, vx: -700, drawWidth: CANVAS_WIDTH * 1.5, drawHeight: CANVAS_HEIGHT };
                    }
                } else if (blastoise.state === 'firing') {
                    if (!hydroPump) { blastoise.state = 'leaving'; if (red) red.state = 'leaving'; }
                } else if (blastoise.state === 'leaving') {
                    blastoise.x += 400 * dt;
                    if (blastoise.x > CANVAS_WIDTH + 360) blastoise = null;
                }
            }

            if (hydroPump) {
                hydroPump.x += hydroPump.vx * dt;
                const isSwept = (obj) => obj.x > hydroPump.x;
                slowpokes = slowpokes.filter(s => !isSwept(s));
                magikarps = magikarps.filter(m => !isSwept(m));
                pidgeots = pidgeots.filter(p => !isSwept(p));
                zapdoses = zapdoses.filter(z => !isSwept(z));
                if (hydroPump.x + hydroPump.drawWidth < -200) hydroPump = null;
            }

            if (alakazam) {
                if (alakazam.state === 'entering') {
                    alakazam.x -= 380 * dt;
                    if (alakazam.x <= alakazam.targetX) { alakazam.x = alakazam.targetX; alakazam.state = 'firing'; isPsychicActive = true; }
                } else if (alakazam.state === 'firing') {
                    if (!isPsychicActive) { alakazam.state = 'leaving'; if (red) red.state = 'leaving'; }
                } else if (alakazam.state === 'leaving') {
                    alakazam.x += 400 * dt;
                    if (alakazam.x > CANVAS_WIDTH + 360) alakazam = null;
                }
            }

            if (isPsychicActive) {
                globalObstacleOpacity -= dt;
                if (globalObstacleOpacity <= 0) {
                    globalObstacleOpacity = 1.0;
                    slowpokes = []; magikarps = []; pidgeots = []; zapdoses = [];
                    isPsychicActive = false;
                    if (!isGhostPhase) {
                        isGhostPhase = true;
                        ghostInterval = setInterval(() => { if (!isGameOver && !isInfiniteMode && !document.hidden) spawnGhost(); }, 500);
                    }
                }
            }

            for (let i = fireParticles.length - 1; i >= 0; i--) {
                const fp = fireParticles[i];
                fp.x += fp.vx * dt; fp.y += fp.vy * dt; fp.size += dt * 15; fp.life -= fp.decay * dt;
                if (fp.life <= 0) fireParticles.splice(i, 1);
            }

            if (speedUpFlashTimer > 0) speedUpFlashTimer -= dt;
            for (let i = speedUpFlashParticles.length - 1; i >= 0; i--) {
                const p = speedUpFlashParticles[i];
                p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
                if (p.life <= 0) speedUpFlashParticles.splice(i, 1);
            }

            if (pikachu.hitInvincibleTimer > 0) {
                pikachu.hitInvincibleTimer -= dt;
                if (pikachu.hitInvincibleTimer < 0) pikachu.hitInvincibleTimer = 0;
            }

            if (pikachu.isInvincible) {
                pikachu.invincibleTimer -= dt;
                if (invincibleStatusElement) {
                    if (pikachu.invincibleTimer <= 1.5) {
                        invincibleStatusElement.style.opacity = Math.floor(pikachu.invincibleTimer * 8) % 2 === 0 ? "1" : "0.2";
                    } else invincibleStatusElement.style.opacity = "1";
                }
                if (pikachu.invincibleTimer <= 0) {
                    pikachu.isInvincible = false;
                    pikachu.speed = pikachu.normalSpeed;
                    if (invincibleStatusElement) invincibleStatusElement.style.display = "none";
                }
            }

            if (!isGhostPhase && !isThunderboltActive && !isInfiniteMode) {
                const targetSlowpokeCount = Math.floor(Math.min(20, 5 + Math.floor(survivalTime / 1.5)) * (2 / 3));
                if (slowpokes.length < targetSlowpokeCount && Math.random() < 0.05) spawnSlowpoke();
            }

            let dx = 0, dy = 0;
            if (keys["ArrowUp"] || keys["w"] || keys["W"]) dy -= 1;
            if (keys["ArrowDown"] || keys["s"] || keys["S"]) dy += 1;
            if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx -= 1;
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx += 1;

            if (dx !== 0 && dy !== 0) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
            if (joystickVector.x !== 0 || joystickVector.y !== 0) { dx = joystickVector.x; dy = joystickVector.y; }

            pikachu.x += dx * pikachu.speed * dt;
            pikachu.y += dy * pikachu.speed * dt;
            pikachu.x = Math.max(pikachu.size, Math.min(CANVAS_WIDTH - pikachu.size, pikachu.x));
            pikachu.y = Math.max(pikachu.size, Math.min(CANVAS_HEIGHT - pikachu.size, pikachu.y));

            for (let i = thunderStones.length - 1; i >= 0; i--) {
                const ts = thunderStones[i];
                ts.x += ts.vx * dt; ts.y += ts.vy * dt;
                if (ts.x < -60 || ts.x > CANVAS_WIDTH + 60 || ts.y < -60 || ts.y > CANVAS_HEIGHT + 60) { thunderStones.splice(i, 1); continue; }
                if (Math.hypot(pikachu.x - ts.x, pikachu.y - ts.y) < pikachu.size + ts.size) {
                    thunderStones.splice(i, 1);
                    pikachu.isInvincible = true; pikachu.invincibleTimer = 4.0; pikachu.speed = pikachu.boostedSpeed;
                    playPowerupSound();
                    if (invincibleStatusElement) {
                        invincibleStatusElement.textContent = "⚡ 라이츄 진화 (무적)! ⚡";
                        invincibleStatusElement.style.display = "inline";
                        invincibleStatusElement.style.opacity = "1";
                    }
                }
            }

            const checkCollision = (target) => {
                if (isGodMode || pikachu.isInvincible || pikachu.hitInvincibleTimer > 0 || isPsychicActive || isThunderboltActive) return false;
                return Math.hypot(pikachu.x - target.x, pikachu.y - target.y) < pikachu.size + target.size;
            };

            const handleHit = () => {
                lives--; updateLivesUI(); playHitSound();
                if (lives <= 0) isGameOver = true;
                else pikachu.hitInvincibleTimer = 1.5;
            };

            const updateObstacleGroup = (arr) => {
                for (let i = arr.length - 1; i >= 0; i--) {
                    const obj = arr[i];
                    obj.x += obj.vx * dt; obj.y += obj.vy * dt;
                    if (obj.x < -250 || obj.x > CANVAS_WIDTH + 250 || obj.y < -250 || obj.y > CANVAS_HEIGHT + 250) { arr.splice(i, 1); continue; }
                    if (checkCollision(obj)) handleHit();
                }
            };

            updateObstacleGroup(slowpokes);
            updateObstacleGroup(magikarps);
            updateObstacleGroup(pidgeots);
            updateObstacleGroup(zapdoses);
            updateObstacleGroup(ghosts);
            updateObstacleGroup(infiniteObstacles);
            updateObstacleGroup(swimmers);
            updateObstacleGroup(dragons);
        }

        function drawSpeechBubble(x, y, text) {
            ctx.save();
            ctx.font = "bold 15px Arial, sans-serif";
            const textWidth = ctx.measureText(text).width;
            const bubbleWidth = textWidth + 24, bubbleHeight = 36;
            const bx = x - bubbleWidth / 2, by = y - 70;

            ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#000000"; ctx.lineWidth = 2.5;
            ctx.beginPath();
            if (typeof ctx.roundRect === "function") ctx.roundRect(bx, by, bubbleWidth, bubbleHeight, 8);
            else ctx.rect(bx, by, bubbleWidth, bubbleHeight);
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x - 6, by + bubbleHeight);
            ctx.lineTo(x + 6, by + bubbleHeight);
            ctx.lineTo(x, by + bubbleHeight + 9);
            ctx.closePath();
            ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.stroke();

            ctx.fillStyle = "#000000"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, x, by + bubbleHeight / 2);
            ctx.restore();
        }

        function drawRestartButton(cx, cy, subText) {
            ctx.save();
            const btnWidth = 260, btnHeight = 44;
            const btnX = cx - btnWidth / 2, btnY = cy - btnHeight / 2;
            restartBtnRect = { x: btnX, y: btnY, w: btnWidth, h: btnHeight };

            ctx.fillStyle = "rgba(255, 255, 255, 0.12)"; ctx.strokeStyle = "#FFDD00"; ctx.lineWidth = 2;
            ctx.beginPath();
            if (typeof ctx.roundRect === "function") ctx.roundRect(btnX, btnY, btnWidth, btnHeight, 22);
            else ctx.rect(btnX, btnY, btnWidth, btnHeight);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = "#FFDD00"; ctx.font = "bold 17px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(subText, cx, cy);
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            /* 플레이어 렌더링 */
            ctx.save();
            if (pikachu.hitInvincibleTimer > 0 && !pikachu.isInvincible && !isGodMode) {
                ctx.globalAlpha = Math.floor(pikachu.hitInvincibleTimer * 14) % 2 === 0 ? 0.3 : 1.0;
            }
            const isCurrentRaichu = pikachu.isInvincible || isGodMode;
            const activePlayerImg = isCurrentRaichu ? (raichuLoaded ? raichuImg : pikachuImg) : (pikachuLoaded ? pikachuImg : null);

            if (activePlayerImg) {
                const w = isCurrentRaichu ? 60 : pikachu.drawWidth;
                const h = isCurrentRaichu ? 60 : pikachu.drawHeight;
                ctx.drawImage(activePlayerImg, pikachu.x - w / 2, pikachu.y - h / 2, w, h);
            } else {
                ctx.fillStyle = "#ffffff"; ctx.font = "34px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(isCurrentRaichu ? "⚡🐭" : "⚡", pikachu.x, pikachu.y);
            }
            ctx.restore();

            /* 장애물 렌더링 */
            ctx.save();
            ctx.globalAlpha = globalObstacleOpacity;

            const drawEntities = (arr, getImg, defaultEmoji, fontSize = "28px") => {
                arr.forEach(item => {
                    const img = getImg(item);
                    if (img) {
                        ctx.drawImage(img, item.x - item.drawWidth / 2, item.y - item.drawHeight / 2, item.drawWidth, item.drawHeight);
                    } else {
                        ctx.fillStyle = "#ffffff"; ctx.font = `${fontSize} sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                        ctx.fillText(defaultEmoji(item), item.x, item.y);
                    }
                });
            };

            drawEntities(thunderStones, () => thunderStoneLoaded ? thunderStoneImg : null, () => "💎");
            drawEntities(slowpokes, s => s.type === 'slowbro' ? (slowbroLoaded ? slowbroImg : null) : (s.type === 'slowking' ? (slowkingLoaded ? slowkingImg : null) : (slowpokeLoaded ? slowpokeImg : null)), s => s.type === 'slowking' ? '👑' : '🦛');
            drawEntities(magikarps, m => m.type === 'mew' ? (mewLoaded ? mewImg : null) : (magikarpLoaded ? magikarpImg : null), m => m.type === 'mew' ? '✨' : '🐟');
            drawEntities(pidgeots, p => p.type === 'jynx' ? (jynxLoaded ? jynxImg : null) : (p.type === 'red_gyarados' ? (redGyaradosLoaded ? redGyaradosImg : null) : (p.type === 'gyarados' ? (gyaradosLoaded ? gyaradosImg : null) : (pidgeotLoaded ? pidgeotImg : null))), () => "🦅");
            drawEntities(zapdoses, z => z.type === 'articuno' ? (articunoLoaded ? articunoImg : null) : (z.type === 'moltres' ? (moltresLoaded ? moltresImg : null) : (z.type === 'mewtwo' ? (mewtwoLoaded ? mewtwoImg : null) : (z.type === 'oak' ? (oakLoaded ? oakImg : null) : (z.type === 'snorlax' ? (snorlaxLoaded ? snorlaxImg : null) : (z.type === 'hooh' ? (hoohLoaded ? hoohImg : null) : (zapdosLoaded ? zapdosImg : null))))), () => "⚡");
            drawEntities(ghosts, g => g.type === 'gastly' ? (gastlyLoaded ? gastlyImg : null) : (g.type === 'haunter' ? (haunterLoaded ? haunterImg : null) : (gengarLoaded ? gengarImg : null)), () => "👻");
            drawEntities(infiniteObstacles, obs => obs.name === 'lapras' ? (laprasLoaded ? laprasImg : null) : (newObstacleImgs[obs.name]?.loaded ? newObstacleImgs[obs.name].img : null), obs => obs.emoji || "❓");
            drawEntities(swimmers, sw => sw.type === 'swimmerf2' ? (swimmerf2Loaded ? swimmerf2Img : null) : (swimmerLoaded ? swimmerImg : null), () => "🏊‍♀️");
            drawEntities(dragons, d => d.type === 'dratini' ? (dratiniLoaded ? dratiniImg : null) : (d.type === 'dragonair' ? (dragonairLoaded ? dragonairImg : null) : (dragoniteLoaded ? dragoniteImg : null)), () => "🐉");
            ctx.restore();

            /* 보스 및 보조 객체 */
            if (blastoise) {
                if (blastoiseLoaded) ctx.drawImage(blastoiseImg, blastoise.x - blastoise.drawWidth / 2, blastoise.y - blastoise.drawHeight / 2, blastoise.drawWidth, blastoise.drawHeight);
                else { ctx.fillStyle = "#ffffff"; ctx.font = "80px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🐢", blastoise.x, blastoise.y); }
            }
            if (alakazam) {
                if (alakazamLoaded) ctx.drawImage(alakazamImg, alakazam.x - alakazam.drawWidth / 2, alakazam.y - alakazam.drawHeight / 2, alakazam.drawWidth, alakazam.drawHeight);
                else { ctx.fillStyle = "#ffffff"; ctx.font = "80px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🥄", alakazam.x, alakazam.y); }
            }
            if (charizard) {
                if (charizardLoaded) ctx.drawImage(charizardImg, charizard.x - charizard.drawWidth / 2, charizard.y - charizard.drawHeight / 2, charizard.drawWidth, charizard.drawHeight);
                else { ctx.fillStyle = "#ffffff"; ctx.font = "80px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🐲", charizard.x, charizard.y); }
            }
            if (red) {
                if (redLoaded) ctx.drawImage(redImg, red.x - red.drawWidth / 2, red.y - red.drawHeight / 2, red.drawWidth, red.drawHeight);
                else { ctx.fillStyle = "#ffffff"; ctx.font = "60px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("👦🏻", red.x, red.y); }
                if (red.state.startsWith('shouting') && red.text) drawSpeechBubble(red.x, red.y, red.text);
            }

            /* 게임 오버 overlay */
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = "#ff4d4d";
                ctx.font = "bold 38px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("GAME OVER", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 50);

                ctx.fillStyle = "#ffffff";
                ctx.font = "20px sans-serif";
                ctx.fillText(`최종 스코어: ${score}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);

                drawRestartButton(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 65, "🔄 다시 시작하기");
            }
        }

        function gameLoop(time) {
            update(time);
            draw();
            if (!isGameOver) requestAnimationFrame(gameLoop);
        }

        updateLivesUI();
        startSpecialTimers();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
